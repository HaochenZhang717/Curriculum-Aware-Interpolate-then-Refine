[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cair-imputation"
version = "1.0.0"
description = "Curriculum-Aware Interpolate-then-Refine for physiological time-series imputation."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cgm", "glucose", "imputation", "time-series", "deep-learning"]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "torch>=2.1,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Extras only needed to (re)prepare external datasets from raw sources.
data = [
  "openpyxl>=3.1",
  "jinja2>=3.1",
]
dev = [
  "pytest>=8.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2608.21207"

[project.scripts]
cgm-datasets = "cgm_datasets.prepare:main"
cair-eval = "experiments.evaluation.eval_cair:main"
cair-eval-shortgap = "experiments.evaluation.eval_short_gaps:main"

[tool.pytest.ini_options]
pythonpath = [".", "baselines/statistical"]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["baselines*", "cgm_datasets*", "experiments*", "methods*", "utils*"]
